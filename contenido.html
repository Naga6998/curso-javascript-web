<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modificar contenido HTML</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Curso de JavaScript aplicado a HTML</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="contenido.html">Modificar contenido HTML</a>
  </nav>

  <main>
    <h2>Modificar contenido HTML</h2>
    <p>Con la propiedad <code>innerHTML</code> podemos cambiar el contenido de cualquier elemento.</p>

    <p id="demo">Este texto va a cambiar al pulsar el botón.</p>
    <button onclick="cambiarContenido()">Cambiar contenido</button>
  </main>

  <footer>
    <p>&copy; 2026 Curso de JavaScript - Todos los derechos reservados</p>
  </footer>

  <script>
    // Cambia el contenido del párrafo con id "demo"
    function cambiarContenido() {
      document.getElementById("demo").innerHTML = "¡Hola! He cambiado el contenido con JavaScript.";
    }
  </script>
</body>
</html>
